services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aviation_quiz
      POSTGRES_USER: aviation
      POSTGRES_PASSWORD: aviation_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviation -d aviation_quiz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://aviation:aviation_local_password@postgres:5432/aviation_quiz
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
